<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Kish 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;min-height:100dvh;display:flex;justify-content:center;align-items:center;
    padding:20px;overflow-x:hidden;font-family:'Poppins',sans-serif;
    background:linear-gradient(-45deg,#ff758f,#ff8fa3,#ffb3c6,#ffc2d1);
    background-size:400% 400%;animation:bg 10s ease infinite;
  }
  @keyframes bg{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  #fx{position:fixed;inset:0;pointer-events:none;z-index:1}

  .card{
    position:relative;z-index:10;width:100%;max-width:410px;text-align:center;
    background:rgba(255,240,245,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:2px solid rgba(255,255,255,.7);border-radius:28px;padding:34px 26px;
    box-shadow:0 20px 50px rgba(201,24,74,.25);animation:pop .6s cubic-bezier(.175,.885,.32,1.275);
  }
  @keyframes pop{0%{opacity:0;transform:scale(.85) translateY(20px)}100%{opacity:1;transform:none}}
  .hidden{display:none!important}

  h1{font-family:'Dancing Script',cursive;color:#c9184a;font-size:36px;line-height:1.2;margin-bottom:10px}
  p{color:#590d22;font-size:15px;line-height:1.6;margin-bottom:20px}
  .big{font-size:68px;display:inline-block;cursor:pointer;animation:bounce 2s infinite;filter:drop-shadow(0 6px 12px rgba(255,77,109,.3))}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

  button{font-family:'Poppins',sans-serif;font-size:15px;font-weight:600;border:none;border-radius:50px;
    padding:13px 26px;cursor:pointer;transition:all .25s ease}
  .btn-yes{background:linear-gradient(135deg,#ff4d6d,#c9184a);color:#fff;box-shadow:0 8px 20px rgba(255,77,109,.45)}
  .btn-yes:active{transform:scale(.96)}
  .btn-soft{background:#ffe5ec;color:#800f2f;border:1px solid #ffb3c6}
  .row{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}

  /* typed note */
  .note{background:rgba(255,255,255,.65);border:1px dashed #ff8fa3;border-radius:18px;
    padding:18px;margin-bottom:20px;min-height:96px;display:flex;align-items:center;justify-content:center}
  .note p{margin:0;font-size:15px}
  .dots{color:#c9184a;font-size:13px;margin-bottom:16px;letter-spacing:4px}

  /* tap-to-reveal reasons */
  #reasons{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
  .reason{background:#fff;color:#c9184a;border:2px dashed #ff8fa3;border-radius:16px;
    padding:14px;font-size:15px;line-height:1.5;font-weight:600}
  .reason.open{border-style:solid;border-color:#ff4d6d;color:#590d22;font-weight:400;animation:pop .4s}
